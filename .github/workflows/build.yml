name: build

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Image tag, e.g. 0.2.1-rc.5-r1"
        required: true
        default: "0.2.1-rc.5-r1"
      dsh_version:
        description: "Upstream @deepseek-ai/dsh version"
        required: true
        default: "0.2.1-rc.5"
  workflow_call:
    inputs:
      image_version:
        description: "Image tag"
        type: string
        required: true
      dsh_version:
        description: "Upstream @deepseek-ai/dsh version"
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  # 仓库名必须全小写，github.repository_owner 会保留大小写（Aionrhine）
  IMAGE: ghcr.io/aionrhine/deepseek-harness

concurrency:
  group: build-${{ inputs.image_version }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing tag
        run: |
          if docker buildx imagetools inspect "${IMAGE}:${{ inputs.image_version }}" >/dev/null 2>&1; then
            echo "refusing to overwrite existing tag: ${IMAGE}:${{ inputs.image_version }}" >&2
            exit 1
          fi

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 只推 digest，不创建任何 tag；合并由 merge job 完成
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          build-args: |
            DSH_VERSION=${{ inputs.dsh_version }}
            IMAGE_VERSION=${{ inputs.image_version }}
            IMAGE_REVISION=${{ github.sha }}
      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.push.outputs.digest }}" > "/tmp/digests/${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Create multi-arch manifest
        run: |
          AMD=$(cat /tmp/digests/amd64)
          ARM=$(cat /tmp/digests/arm64)
          echo "amd64=${AMD}"
          echo "arm64=${ARM}"
          docker buildx imagetools create \
            -t "${IMAGE}:${{ inputs.image_version }}" \
            "${IMAGE}@${AMD}" "${IMAGE}@${ARM}"
      - name: Show result
        run: docker buildx imagetools inspect "${IMAGE}:${{ inputs.image_version }}"
